spring.config.import=optional:application-local.properties

spring.application.name=cinelens-backend

# DB 연결
spring.datasource.url=jdbc:mysql://localhost:3306/cinelens?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 서버 포트
server.port=8080